name: bwv-watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bwv-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Seiten pruefen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Zustand speichern
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "bwv-watch"
            git config user.email "actions@github.com"
            git add state.json
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
